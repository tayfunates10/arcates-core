name: CI

on:
  push:
    branches: [main, dev, 'feature/**', 'claude/**']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arcates
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, fileinfo, gd, curl, soap, xml

      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Static and contract tests
        run: php tests/run.php

      - name: Runtime MySQL behavior tests
        run: |
          cp tests/fixtures/config.ci.php config.php
          php tests/runtime_mysql.php
          php tests/runtime_abandoned_mysql.php

      - name: Readability guard
        run: php tests/readability.php
